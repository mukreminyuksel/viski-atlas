name: Fiyat güncelle

on:
  schedule:
    - cron: "17 3 * * 1" # Her pazartesi 06:17 (TR)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fiyat-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: scripts
      - name: Fiyatları araştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fiyat-guncelle.mjs
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "viski-atlas-bot"
          git config user.email "viski-atlas-bot@users.noreply.github.com"
          git add data/fiyatlar.json
          git diff --cached --quiet && exit 0
          git commit -m "Fiyatlar otomatik güncellendi ($(date +%Y-%m-%d))"
          git push
